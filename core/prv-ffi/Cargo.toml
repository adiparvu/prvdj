[package]
name = "prv-ffi"
description = "The C ABI boundary: the portable core, callable from any host language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `staticlib` is what every host links: the Apple targets, the C harness in
# `tests/`, and the Swift package. `rlib` is what this crate's own tests link
# against.
#
# Deliberately no `cdylib`. Producing one as well puts a `libprv_ffi.so` beside
# the archive, and a Unix linker given `-lprv_ffi` prefers the shared object —
# so `swift test` would build against the archive's declarations and then fail
# to start for want of a library at run time. There is no host that wants the
# shared object, so the simplest fix is not to make one.
crate-type = ["staticlib", "rlib"]

[dependencies]
prv-project = { path = "../prv-project" }
prv-render = { path = "../prv-render" }
prv-rt = { path = "../prv-rt" }
prv-time = { path = "../prv-time" }
prv-timeline = { path = "../prv-timeline" }
prv-transport = { path = "../prv-transport" }

[lints]
workspace = true
